# control-tower 的 CI：质量门禁 + 三镜像双注册表发布。
#
# 触发策略（与 ecommerce 同一纪律）：
#   - PR / workflow_dispatch：只跑质量门禁（test job）。
#   - push main / 裸 semver tag（X.Y.Z）：质量门禁 + 构建并推送镜像。main 使用 dev tag。
#   - 裸 semver tag 额外跑 release job：把 pre 的镜像 tag 推进到该版本并推到 GitLab 镜像仓，
#     Argo CD 经 webhook 同步上线（GitOps 链路见 docs/operations/argocd-helm-gitops.md）。
#
# 镜像（P2 起增加 control-tower-config-web）：
#   control-tower-gateway   网关          services/gateway/Dockerfile   上下文 .
#   control-tower-config    配置中心      services/config/Dockerfile    上下文 .
# 同时推 GHCR 与 TCR：
#   ghcr.io/lens077/<name>                    （公网拉取）
#   ccr.ccs.tencentyun.com/sumery/<name>      （集群内拉取，与 ecommerce 同一注册表）
# tag 策略：sha-<7位提交哈希> 不可变，部署引用它；发布 tag（X.Y.Z）同名镜像 tag 供追溯；
# dev 是便利 tag，会被后续发布覆盖，不要用于生产。
name: CI

on:
  push:
    branches:
      - main
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GHCR_NAMESPACE: ghcr.io/${{ github.repository_owner }}
  TCR_REGISTRY: ccr.ccs.tencentyun.com
  TCR_NAMESPACE: sumery

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -short -race -count=1 ./...

      # 部署清单门禁：deploy/{dev,pre} 必须等于 deploy/chart 的渲染结果（scripts/deploy-render.py）。
      # helm 版本钉死与本地一致：渲染产物按字节比对，helm 换大版本可能出假 diff。
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.3.0

      - name: Deploy manifests up-to-date (helm lint + render diff)
        run: make check-deploy

      - name: Set up buf
        uses: bufbuild/buf-setup-action@v1
        with:
          # 钉死 buf 版本：action 默认还停在 1.50.0，与本地 1.72.0 生成的
          # third_party/validate/validate.pb.go 不一致，会让 check-gen 出一次假 diff。
          # 升级本地 buf 时同步改这里。
          version: "1.72.0"
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Buf lint
        run: buf lint

      # 契约门禁：PR 内拦截破坏性变更。wire 冻结期由本门禁 + P2 的
      # 「一次性 against config-center 旧仓」共同保障（后者在本地执行，见 docs/design/decisions.md）。
      - name: Buf breaking
        if: github.event_name == 'pull_request'
        run: buf breaking --against "https://github.com/${{ github.repository }}.git#branch=${{ github.base_ref }}"

  # 控制台质量门禁：单测 + tsc + 生产构建。之前 CI 完全没跑 web，
  # 生成物缺失 / Storage 缺失这类只在 pnpm test 里暴露的问题一直漏到发布后。
  web:
    name: web
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile --config.strictDepBuilds=false

      - name: Test
        run: pnpm test

      - name: Build (vp build + tsc)
        run: pnpm build

  # 生成物门禁：Go/Connect/TS 三份产物必须与 proto 源一致。
  # 插件版本钉死在 go.mod（Go）与 web/pnpm-lock.yaml（protoc-gen-es），所以 diff 只反映 proto 变更。
  codegen:
    name: codegen up-to-date
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up buf
        uses: bufbuild/buf-setup-action@v1
        with:
          # 钉死 buf 版本：action 默认还停在 1.50.0，与本地 1.72.0 生成的
          # third_party/validate/validate.pb.go 不一致，会让 check-gen 出一次假 diff。
          # 升级本地 buf 时同步改这里。
          version: "1.72.0"
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install protoc-gen-es
        run: pnpm install --frozen-lockfile --config.strictDepBuilds=false
        working-directory: web

      - name: Install Go plugins at go.mod versions
        run: make tools

      - name: Regenerate and diff
        run: make check-gen

  image:
    name: image (${{ matrix.name }})
    # main 与发布 tag 都构建镜像；main 推送 dev/sha 标签，发布 tag 额外推版本标签。
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    needs: [test, web, codegen]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: control-tower-gateway
            context: .
            dockerfile: services/gateway/Dockerfile
          - name: control-tower-config
            context: .
            dockerfile: services/config/Dockerfile
          - name: control-tower-config-web
            context: web
            dockerfile: web/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # TCR 凭据未配置时自动降级为只推 GHCR（不阻塞发布 tag）。
      - name: Detect TCR credentials
        id: tcr
        env:
          TCR_USERNAME: ${{ secrets.TCR_USERNAME }}
        run: |
          if [ -n "$TCR_USERNAME" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::TCR_USERNAME/TCR_PASSWORD 未配置，仅推送 GHCR"
          fi

      - name: Login to TCR
        if: steps.tcr.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.TCR_REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Compute image tags
        id: meta
        run: |
          echo "sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          release_tag=""
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            release_tag="$GITHUB_REF_NAME"
          fi
          echo "release=$release_tag" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "${GHCR_NAMESPACE}/${{ matrix.name }}:sha-${GITHUB_SHA::7}"
            echo "${GHCR_NAMESPACE}/${{ matrix.name }}:dev"
            if [ -n "$release_tag" ]; then
              echo "${GHCR_NAMESPACE}/${{ matrix.name }}:$release_tag"
            fi
            if [ "${{ steps.tcr.outputs.enabled }}" = "true" ]; then
              echo "${TCR_REGISTRY}/${TCR_NAMESPACE}/${{ matrix.name }}:sha-${GITHUB_SHA::7}"
              echo "${TCR_REGISTRY}/${TCR_NAMESPACE}/${{ matrix.name }}:dev"
              if [ -n "$release_tag" ]; then
                echo "${TCR_REGISTRY}/${TCR_NAMESPACE}/${{ matrix.name }}:$release_tag"
              fi
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
          build-args: |
            VERSION=${{ steps.meta.outputs.release }}
            GOPROXY=https://proxy.golang.org,direct
          tags: ${{ steps.meta.outputs.tags }}

  # 发布推进（只在裸 semver tag 上跑）：三个镜像已由 image job 推到 TCR，这里把 pre 指向它们。
  #   1. scripts/promote-release.sh：改 values-pre.yaml 的三个 tag → 渲染 deploy/pre → 守门测试；
  #   2. 提交到 GitHub main（[skip ci]，且本 workflow 只由 tag 触发，回写不会再触发自己）；
  #   3. 同一提交 fast-forward 推到 GitLab 镜像 gitlab.com/sumery/control-tower —— Argo CD 的 source
  #      是 GitLab（GitLab 免费版没有 pull mirror），GitLab 的 push webhook 会立刻通知 Argo CD 同步。
  # push main 不部署：main 只出 sha-* 镜像；线上版本只随发布 tag 变化（AGENTS.md「发布方式」）。
#
# ⚠️ 提交说明里不要出现字面量「[skip ci]」（包括正文里引用它）：GitHub 按 push 的 head 提交
#    说明判断，main 推送与 tag 推送都会被整个跳过。2026-09-27 首次打 0.2.18 就因此没有任何 run，
#    只好把 tag 挪到下一个提交。
  release:
    name: release → pre (GitOps)
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-main
      cancel-in-progress: false
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      # 发布 tag 必须打在 main 的历史上：镜像是按 tag 提交构建的，而本 job 改的是 main 的 values；
      # 两者不在一条线上，线上就会跑着 main 没有的代码。
      - name: Tag must be an ancestor of main
        run: |
          git merge-base --is-ancestor "${GITHUB_SHA}" HEAD \
            || { echo "::error::tag ${GITHUB_REF_NAME}（${GITHUB_SHA::7}）不在 main 的历史上，拒绝推进"; exit 1; }

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.3.0

      - name: Promote ${{ github.ref_name }} to pre
        run: scripts/promote-release.sh "${GITHUB_REF_NAME}"

      - name: Commit and push to GitHub main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/chart/control-tower/values-pre.yaml deploy/pre
          git diff --cached --quiet && { echo "values 已是 ${GITHUB_REF_NAME}，无需提交"; exit 0; }
          git commit -m "release: ${GITHUB_REF_NAME} → pre [skip ci]" \
            -m "由 ci.yml release job 生成：values-pre.yaml 三个镜像 tag 指向发布 tag ${GITHUB_REF_NAME}，deploy/pre 重新渲染。"
          # 与其它推送竞争时 rebase 重试；本 job 只改 values-pre 与渲染产物，冲突概率极低
          for i in 1 2 3; do
            git push origin HEAD:main && break
            [[ $i -eq 3 ]] && { echo "::error::push GitHub main 重试 3 次失败"; exit 1; }
            git pull --rebase origin main
          done

      # 只做 fast-forward：GitLab 若领先说明有人直接推了镜像仓，让 job 红比静默分叉好。
      - name: Push main to GitLab (Argo CD source)
        env:
          GITLAB_PUSH_TOKEN: ${{ secrets.GITLAB_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$GITLAB_PUSH_TOKEN" ]] || { echo "::error::缺 secret GITLAB_PUSH_TOKEN，GitLab 未更新，Argo CD 看不到 ${GITHUB_REF_NAME}"; exit 1; }
          git remote add gitlab "https://oauth2:${GITLAB_PUSH_TOKEN}@gitlab.com/sumery/control-tower.git"
          git fetch -q gitlab main
          if ! git merge-base --is-ancestor gitlab/main HEAD; then
            echo "::error::GitLab main 有 GitHub 没有的提交，拒绝推送；先把两边手动对齐"
            git log --oneline HEAD..gitlab/main | head -20
            exit 1
          fi
          git push gitlab HEAD:main
          echo "已推送 $(git rev-parse --short HEAD) 到 GitLab；Argo CD 会经 webhook 同步"
