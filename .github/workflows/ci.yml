# control-tower 的 CI：质量门禁 + 三镜像双注册表发布。
#
# 触发策略（与 ecommerce 同一纪律）：
#   - PR / workflow_dispatch：只跑质量门禁（test job）。
#   - push main / 裸 semver tag（X.Y.Z）：质量门禁 + 构建并推送镜像。main 使用 dev tag。
#
# 镜像（P2 起增加 control-tower-config-web）：
#   control-tower-gateway   网关          services/gateway/Dockerfile   上下文 .
#   control-tower-config    配置中心      services/config/Dockerfile    上下文 .
# 同时推 GHCR 与 TCR：
#   ghcr.io/lens077/<name>                    （公网拉取）
#   ccr.ccs.tencentyun.com/sumery/<name>      （集群内拉取，与 ecommerce 同一注册表）
# tag 策略：sha-<7位提交哈希> 不可变，部署引用它；发布 tag（X.Y.Z）同名镜像 tag 供追溯；
# dev 是便利 tag，会被后续发布覆盖，不要用于生产。
name: CI

on:
  push:
    branches:
      - main
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GHCR_NAMESPACE: ghcr.io/${{ github.repository_owner }}
  TCR_REGISTRY: ccr.ccs.tencentyun.com
  TCR_NAMESPACE: sumery

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -short -race -count=1 ./...

      - name: Set up buf
        uses: bufbuild/buf-setup-action@v1
        with:
          # 钉死 buf 版本：action 默认还停在 1.50.0，与本地 1.72.0 生成的
          # third_party/validate/validate.pb.go 不一致，会让 check-gen 出一次假 diff。
          # 升级本地 buf 时同步改这里。
          version: "1.72.0"
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Buf lint
        run: buf lint

      # 契约门禁：PR 内拦截破坏性变更。wire 冻结期由本门禁 + P2 的
      # 「一次性 against config-center 旧仓」共同保障（后者在本地执行，见 docs/design/decisions.md）。
      - name: Buf breaking
        if: github.event_name == 'pull_request'
        run: buf breaking --against "https://github.com/${{ github.repository }}.git#branch=${{ github.base_ref }}"

  # 控制台质量门禁：单测 + tsc + 生产构建。之前 CI 完全没跑 web，
  # 生成物缺失 / Storage 缺失这类只在 pnpm test 里暴露的问题一直漏到发布后。
  web:
    name: web
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile --config.strictDepBuilds=false

      - name: Test
        run: pnpm test

      - name: Build (vp build + tsc)
        run: pnpm build

  # 生成物门禁：Go/Connect/TS 三份产物必须与 proto 源一致。
  # 插件版本钉死在 go.mod（Go）与 web/pnpm-lock.yaml（protoc-gen-es），所以 diff 只反映 proto 变更。
  codegen:
    name: codegen up-to-date
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up buf
        uses: bufbuild/buf-setup-action@v1
        with:
          # 钉死 buf 版本：action 默认还停在 1.50.0，与本地 1.72.0 生成的
          # third_party/validate/validate.pb.go 不一致，会让 check-gen 出一次假 diff。
          # 升级本地 buf 时同步改这里。
          version: "1.72.0"
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install protoc-gen-es
        run: pnpm install --frozen-lockfile --config.strictDepBuilds=false
        working-directory: web

      - name: Install Go plugins at go.mod versions
        run: make tools

      - name: Regenerate and diff
        run: make check-gen

  image:
    name: image (${{ matrix.name }})
    # main 与发布 tag 都构建镜像；main 推送 dev/sha 标签，发布 tag 额外推版本标签。
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    needs: [test, web, codegen]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: control-tower-gateway
            context: .
            dockerfile: services/gateway/Dockerfile
          - name: control-tower-config
            context: .
            dockerfile: services/config/Dockerfile
          - name: control-tower-config-web
            context: web
            dockerfile: web/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # TCR 凭据未配置时自动降级为只推 GHCR（不阻塞发布 tag）。
      - name: Detect TCR credentials
        id: tcr
        env:
          TCR_USERNAME: ${{ secrets.TCR_USERNAME }}
        run: |
          if [ -n "$TCR_USERNAME" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::TCR_USERNAME/TCR_PASSWORD 未配置，仅推送 GHCR"
          fi

      - name: Login to TCR
        if: steps.tcr.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.TCR_REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Compute image tags
        id: meta
        run: |
          echo "sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          release_tag=""
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            release_tag="$GITHUB_REF_NAME"
          fi
          echo "release=$release_tag" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "${GHCR_NAMESPACE}/${{ matrix.name }}:sha-${GITHUB_SHA::7}"
            echo "${GHCR_NAMESPACE}/${{ matrix.name }}:dev"
            if [ -n "$release_tag" ]; then
              echo "${GHCR_NAMESPACE}/${{ matrix.name }}:$release_tag"
            fi
            if [ "${{ steps.tcr.outputs.enabled }}" = "true" ]; then
              echo "${TCR_REGISTRY}/${TCR_NAMESPACE}/${{ matrix.name }}:sha-${GITHUB_SHA::7}"
              echo "${TCR_REGISTRY}/${TCR_NAMESPACE}/${{ matrix.name }}:dev"
              if [ -n "$release_tag" ]; then
                echo "${TCR_REGISTRY}/${TCR_NAMESPACE}/${{ matrix.name }}:$release_tag"
              fi
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
          build-args: |
            VERSION=${{ steps.meta.outputs.release }}
            GOPROXY=https://proxy.golang.org,direct
          tags: ${{ steps.meta.outputs.tags }}

  # 公网当前使用 ecommerce/dev gateway + config-center 三个 Deployment。
  # 仅 main 自动滚动线上；版本 tag 只发布镜像，避免发布追溯 tag 意外切流。
  deploy-public:
    name: deploy public dev
    if: github.ref == 'refs/heads/main'
    needs: [image]
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          test -n "$KUBECONFIG_B64" || { echo "KUBECONFIG_B64 is required for public deployment" >&2; exit 1; }
          install -d -m 700 "$RUNNER_TEMP/kube"
          printf '%s' "$KUBECONFIG_B64" | base64 --decode > "$RUNNER_TEMP/kube/config"
          chmod 600 "$RUNNER_TEMP/kube/config"
          echo "KUBECONFIG=$RUNNER_TEMP/kube/config" >> "$GITHUB_ENV"

      - name: Roll out immutable commit images
        run: |
          IMAGE_TAG="sha-${GITHUB_SHA::7}"
          kubectl -n ecommerce set image deployment/control-tower-gateway gateway=ccr.ccs.tencentyun.com/sumery/control-tower-gateway:$IMAGE_TAG
          kubectl -n config-center set image deployment/config-center config-center=ccr.ccs.tencentyun.com/sumery/control-tower-config:$IMAGE_TAG
          kubectl -n config-center set image deployment/config-center-web config-center-web=ccr.ccs.tencentyun.com/sumery/control-tower-config-web:$IMAGE_TAG
          kubectl -n ecommerce rollout status deployment/control-tower-gateway --timeout=5m
          kubectl -n config-center rollout status deployment/config-center --timeout=5m
          kubectl -n config-center rollout status deployment/config-center-web --timeout=5m
