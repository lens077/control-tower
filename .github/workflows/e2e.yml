name: e2e

# 实机浏览器端到端：打**真实环境**，覆盖 config 控制台与 gateway 两条链路。
#
# 控制台默认打 **e2e 专属域** e2e.control-tower.apikv.com —— 它与生产域
# control-tower.apikv.com 指向同一份 EdgeOne Makers 部署（同一份 dist、同一套 Casdoor
# 与后端 API），只是 Host 不同。这样一天 4 轮的巡检流量不会混进生产域的 EdgeOne 流量
# 统计里，看板按域名筛即可只看真实用户；想验证生产域自身的链路就手动 dispatch 时
# 显式填 config_url。
#
# 为什么不挂在 PR 上：这套用例断言的是「**已经部署出去的东西**是否正常」，
# 而 PR 里的代码还没构建成镜像、更没上集群。挂在 PR 上只会得到两种坏结果 ——
# 要么测的是旧版本（绿了但毫无意义），要么因为外部环境抖动把无辜的 PR 拦红。
#
# 正常有两个触发口：workflow_dispatch（发布后）＋ schedule（环境巡检）。
# 2026-08-31 三条公网 HTTPRoute 恢复后，schedule 已重新启用。
on:
  workflow_dispatch:
    inputs:
      config_url:
        description: "控制台地址（留空用 e2e 专属域 https://e2e.control-tower.apikv.com；要验证生产域自身的 DNS/证书链路就显式传 https://control-tower.apikv.com）"
        required: false
        type: string
      config_api_url:
        description: "Config API 地址（留空用默认 https://config-api.apikv.com）"
        required: false
        type: string
      gateway_url:
        description: "网关地址（留空用默认 https://gateway.apikv.com）"
        required: false
        type: string
      metrics_url:
        description: "VictoriaMetrics 地址（留空用默认 https://metrics.apikv.com，经 vmauth 只读）"
        required: false
        type: string
      admin_mutations:
        description: "运行会签发并吊销临时 Machine Token 的管理面功能测试"
        required: false
        default: false
        type: boolean
  # ⚠️ schedule 暂时停用（2026-10-25）：e2e 的默认目标已切到 e2e 专属域
  # e2e.control-tower.apikv.com，该域名还需要在 EdgeOne Makers 控制台绑定到项目
  # control-tower-web、签发证书，并把 https://e2e.control-tower.apikv.com/callback
  # 加进 Casdoor 应用 ecommerce 的回调白名单。这三步完成前，每 6 小时的巡检必然红
  # （域名还不存在），红的原因与代码无关，只会淹没有效告警。
  # 手动 dispatch 验证通过后取消下面的注释恢复巡检。
  # schedule:
  #   - cron: "0 */6 * * *"

# 用例串行共享同一个 Casdoor 会话，两次运行叠在一起会互相踢。
# 不取消进行中的那次：巡检结果比「最新一次」更重要。
concurrency:
  group: e2e
  cancel-in-progress: false

# 恢复通知要回查上一次运行的结论，需要 actions:read。
permissions:
  contents: read
  actions: read

jobs:
  e2e:
    name: e2e (browser)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: e2e
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # 预检：先把目标的真实响应打出来，再花 40s 装浏览器。
      #
      # 2026-10-15 的教训：egde-one.apikv.com 当时返回 19 字节的纯文本 `404 page not found`，
      # 页面「加载成功」却根本没有控制台，用例一路走到点「登录」按钮才超时 30s。
      # 报错停在「点不到按钮」会把排查方向带偏成「控制台改版改没了按钮」，
      # 实际是 DNS/隧道没通。这里先探一次，日志第一屏就能看到到底是什么响应。
      #
      # continue-on-error：只做诊断，不代替用例做判定，绝不把绿的运行判红
      # （瞬时抖动让 curl 失败不代表用例会失败，用例自己有重试）。
      # 与 playwright.config.ts 里的默认值必须保持一致。
      - name: "Preflight: 控制台可达性"
        continue-on-error: true
        env:
          TARGET: ${{ inputs.config_url || 'https://e2e.control-tower.apikv.com' }}
          # 与 e2e/playwright.config.ts 的 E2E_UA_MARKER 保持一致。
          # 预检这一次 curl 同样会被 EdgeOne 计入请求数，不打标记就漏进真实用户流量里。
          UA: "curl/8 control-tower-e2e/1.0 preflight"
        run: |
          set -uo pipefail
          echo "探测目标: $TARGET"
          for i in 1 2 3; do
            if out=$(curl -sS --max-time 15 -A "$UA" -o /tmp/pf.body -w '%{http_code} %{size_download}' "$TARGET" 2>&1); then
              echo "第 $i 次: $out 字节"
              break
            fi
            echo "第 $i 次失败: $out"
            [ "$i" -lt 3 ] && sleep 3
          done
          echo "--- 响应正文（前 200 字节）---"
          head -c 200 /tmp/pf.body 2>/dev/null || true
          echo
          echo "--- 是否像控制台（应含 <div id=\"app\">）---"
          if grep -q 'id="app"' /tmp/pf.body 2>/dev/null; then
            verdict="✅ 拿到控制台 index.html"
          else
            verdict="⚠️ 不是控制台页面 —— 用例必然失败，见上面正文判断原因"
          fi
          echo "$verdict"
          # 写进 run 的 Summary：失败时点开运行页第一眼就能看到原因，
          # 不用去翻几十兆的浏览器日志。
          {
            echo "### 控制台预检"
            echo ""
            echo "目标: \`$TARGET\`"
            echo ""
            echo '```'
            echo "HTTP: ${out:-（探测失败）}"
            head -c 200 /tmp/pf.body 2>/dev/null || true
            echo '```'
            echo ""
            echo "$verdict"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: e2e/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # --with-deps 装的是 chromium 需要的系统库；只装 chromium，不拉 firefox/webkit。
      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e
        env:
          # 测试账号存在仓库 Secrets 里（凭据不进仓库，见 AGENTS.md 硬约束 4）。
          E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_CONFIG_URL: ${{ inputs.config_url }}
          E2E_CONFIG_API_URL: ${{ inputs.config_api_url }}
          E2E_GATEWAY_URL: ${{ inputs.gateway_url }}
          E2E_METRICS_URL: ${{ inputs.metrics_url }}
          # metrics.apikv.com 经 vmauth 只读(2026-09-29); 只读 token, 不能写入或调管理接口。
          E2E_METRICS_TOKEN: ${{ secrets.E2E_METRICS_TOKEN }}
          # token 吊销保留审计行，避免每 6 小时累计记录；只在发布后手动验收时显式打开。
          E2E_ADMIN_MUTATIONS: ${{ inputs.admin_mutations }}
          # 额外出一份 JSON,给下面的失败通知抽「具体哪几条挂了」。
          # 只发「e2e 失败了」这种通知没有信息量,收的人还得点进来才知道发生了什么。
          PLAYWRIGHT_JSON_OUTPUT_NAME: results.json
        # 直呼 playwright,不要写成 `pnpm test -- --reporter=…`:pnpm 会把 `--` 一起
        # 传下去,playwright 把它当成测试文件过滤参数吃掉,reporter 根本没生效 ——
        # 表现是用例照跑照红,但 results.json 不存在,通知里只剩兜底文案。
        run: pnpm exec playwright test --reporter=list,json

      # 失败时最有价值的是 trace 与录像，它们只在报告里。always() 是为了
      # 失败路径也上传 —— 只在成功时上传等于没上传。
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
          if-no-files-found: ignore

      # 恢复通知：上一次是红的、这一次绿了才发。
      #
      # 状态从 GitHub API 现查，不用 actions/cache —— cache 的 key 是不可变的，
      # 要跨 run 更新同一份状态得靠滚动 key + restore-keys，比这脆得多。
      # 只发「由红转绿」这一次：每次成功都发等于把恢复通知变成噪音，
      # 与「告警的价值 = 新信息量」那条规矩相悖。
      - name: Notify ntfy on recovery
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          # 取本工作流上一次**已完成**的运行（排除当前这次）的结论。
          previous=$(gh api "repos/${{ github.repository }}/actions/workflows/e2e.yml/runs?status=completed&per_page=5" \
            --jq "[.workflow_runs[] | select(.id != ${RUN_ID})] | first | .conclusion" 2>/dev/null || echo "")
          echo "上一次运行结论: ${previous:-（查不到，可能是首次运行）}"
          [ "$previous" = "failure" ] || { echo "上一次不是失败，不发恢复通知"; exit 0; }

          payload=$(jq -n --arg topic "$NTFY_TOPIC" --arg url "$RUN_URL" '{
            topic: $topic,
            title: "✅ control-tower e2e 已恢复",
            message: "上一次运行是失败的，这一次全部通过。",
            priority: 3,
            tags: ["white_check_mark"],
            click: $url
          }')
          curl -fsS --max-time 20 -X POST "$NTFY_URL" \
            -H "Authorization: Bearer $NTFY_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$payload"

      # 失败进 ntfy（与 Gatus/Healthchecks/Alertmanager 同一个私有 topic 与 bearer token）。
      # 放在上传报告之后：通知里给的 run 链接点进去就能直接下 trace。
      #
      # 2026-10-21 补去重：与上面 recovery 对称，只发「由绿转红」这一次。
      # 原先每次 failure() 都无条件 POST，schedule 每 6 小时一轮 ——
      # 一个持续故障会在一天里把同一条失败推送 4 次（2026-10-20 实测 13:44 / 14:18
      # 两条内容完全相同的通知），跟「告警的价值 = 新信息量」那条规矩相悖。
      # 代价要说清楚：连续第 2 次及以后的失败不再推送。判定恢复与否请去看
      # Actions 运行历史，不要依赖这里是否又响了一声。
      - name: Notify ntfy on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # 上一次**已完成**的运行（排除当前这次）是否已经红了。
          previous=$(gh api "repos/${{ github.repository }}/actions/workflows/e2e.yml/runs?status=completed&per_page=5" \
            --jq "[.workflow_runs[] | select(.id != ${RUN_ID})] | first | .conclusion" 2>/dev/null || echo "")
          echo "上一次运行结论: ${previous:-（查不到，可能是首次运行）}"
          if [ "$previous" = "failure" ]; then
            echo "上一次也是失败，本次不重复推送；完整历史见 ${{ github.server_url }}/${{ github.repository }}/actions/workflows/e2e.yml"
            exit 0
          fi
          # 抽失败用例名。JSON 是多层嵌套的 suites，用递归匹配「带 ok 且为 false」的节点。
          failed=$(jq -r '[.. | objects | select(has("ok") and has("title") and .ok == false) | .title] | unique | join("\n· ")' results.json 2>/dev/null || true)
          if [ -z "$failed" ]; then
            # 没有 JSON 说明还没跑到用例就挂了（依赖安装、装浏览器、global-setup 登录失败）。
            # 这种情况必须说清楚，否则收到「0 条失败用例」的通知会让人以为是误报。
            failed="（没解析到用例名：多半是依赖安装、装浏览器或登录阶段就失败了）"
          fi
          payload=$(jq -n \
            --arg topic "$NTFY_TOPIC" \
            --arg failed "$failed" \
            --arg url "$RUN_URL" \
            --arg event "$EVENT" \
            '{
              topic: $topic,
              title: "🔴 control-tower e2e 失败",
              message: ("触发：" + $event + "\n失败用例：\n· " + $failed),
              priority: 4,
              tags: ["rotating_light"],
              click: $url
            }')
          curl -fsS --max-time 20 -X POST "$NTFY_URL" \
            -H "Authorization: Bearer $NTFY_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$payload"
