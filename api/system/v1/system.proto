syntax = "proto3";

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "third_party/validate/validate.proto";

package system.v1;

option go_package = "github.com/lens077/control-tower/api/system/v1;systemv1";

// SystemService 给控制台的「系统信息」页供数。
//
// 它单独成域而不是塞进 config.v1:那个域讲的是「配置的读写与版本」,
// 这个域讲的是「这个进程和它脚下的机器过得怎么样」,两者没有共同的概念。
// 混在一起的直接后果是 ConfigService 的 IAM 规则要为一组完全不同的接口开例外。
//
// 全部接口都是管理员专属:IAM 里除 GetKey / WatchKeys 之外的路径都不接受
// 机器 service token,所以这里不需要额外的白名单 —— 默认就是拒绝。
service SystemService {
  // 此刻的读数。数据来自进程内的后台采样器,不经过 VictoriaMetrics,
  // 因此没有采集与推送延迟,VM 挂了也照常能看。
  rpc GetSystemStatus(GetSystemStatusRequest) returns (GetSystemStatusResponse) {}

  // 历史曲线。服务端代理查询 VictoriaMetrics。
  //
  // 前端只能点名要哪几组曲线,不能传 PromQL —— 查询语句固定在服务端。
  // 这不是洁癖:放开 PromQL 等于把时序库开放给任何登录用户,一句
  // {__name__=~".+"}[30d] 就能把 VM 拖垮,而它没有任何自己的鉴权。
  rpc QueryMetrics(QueryMetricsRequest) returns (QueryMetricsResponse) {}
}

// MetricSeries 是服务端预置的具名查询。
//
// 分段编号(进程 1-9 / 节点 10-19 / API 20-29 / 数据库 30-39)是为了以后
// 在某一段里加新项时不必打乱其他段,枚举值一旦发布就不能改。
enum MetricSeries {
  METRIC_SERIES_UNSPECIFIED = 0;

  // ——— 本进程 ——— 来自 sysstat 推给 VM 的 process_* 量表
  METRIC_SERIES_PROCESS_CPU = 1;         // 占 CPU 限额的百分比
  METRIC_SERIES_PROCESS_MEMORY = 2;      // 常驻内存字节
  METRIC_SERIES_PROCESS_GOROUTINES = 3;  // goroutine 数
  METRIC_SERIES_PROCESS_NETWORK = 4;     // 收发速率

  // ——— 所在节点 ——— 来自 otel collector 的 host_metrics
  // 这些是整台机器的口径,不是本进程的。两组同时展示是刻意的:
  // 进程自己很闲但节点被别的负载打满,同样会让配置中心变慢。
  METRIC_SERIES_HOST_CPU = 10;
  METRIC_SERIES_HOST_MEMORY = 11;
  METRIC_SERIES_HOST_DISK = 12;
  METRIC_SERIES_HOST_NETWORK = 13;

  // ——— API ——— 来自 otelconnect 拦截器
  METRIC_SERIES_API_LATENCY = 20;     // P50 / P95 / P99
  METRIC_SERIES_API_THROUGHPUT = 21;  // 每方法 QPS
  METRIC_SERIES_API_ERROR_RATE = 22;  // 非 OK 的 connect 错误码占比

  // ——— 数据库 ——— 来自 otelpgx
  METRIC_SERIES_DB_LATENCY = 30;
  METRIC_SERIES_DB_POOL = 31; // 连接池占用
}

// 值的量纲。前端据此决定格式化方式(百分号 / KB-MB / ms / req/s),
// 而不是按 series 硬编码 —— 后者每加一条曲线都要改前端的 switch。
enum MetricUnit {
  METRIC_UNIT_UNSPECIFIED = 0;
  METRIC_UNIT_PERCENT = 1;
  METRIC_UNIT_BYTES = 2;
  METRIC_UNIT_BYTES_PER_SECOND = 3;
  METRIC_UNIT_MILLISECONDS = 4;
  METRIC_UNIT_REQUESTS_PER_SECOND = 5;
  METRIC_UNIT_COUNT = 6;
}

message GetSystemStatusRequest {}

message GetSystemStatusResponse {
  ProcessStatus process = 1;
  // 配置中心依赖的下游。与 /healthz 用的是同一组检查,
  // 免得「探针说健康、页面说挂了」这种自相矛盾。
  repeated DependencyStatus dependencies = 2;
  BuildInfo build = 3;
  // 为 false 时前端隐藏所有历史曲线并说明原因,而不是画一堆空图。
  bool metrics_backend_available = 4;
}

// ProcessStatus 是「本进程 / 本 Pod」的资源占用。
//
// 注意与 HOST_* 系列的区别:这里的分母是 cgroup 限额(k8s 的 limits),
// 不是宿主机规格。一个 limits.cpu=200m 的 Pod 把配额吃满时这里显示 100%,
// 而节点 CPU 可能才 5% —— 两个数都对,回答的是不同的问题。
message ProcessStatus {
  double cpu_percent = 1;       // 0..100,相对 cpu_limit_cores
  double cpu_limit_cores = 2;

  int64 memory_rss_bytes = 3;
  int64 memory_limit_bytes = 4;

  int64 go_heap_bytes = 5;
  int32 goroutines = 6;
  uint32 gc_count = 7;

  string disk_path = 8;
  int64 disk_used_bytes = 9;
  int64 disk_total_bytes = 10;

  double net_rx_bytes_per_sec = 11;
  double net_tx_bytes_per_sec = 12;

  // false 表示没读到 cgroup 限额,上面两个 limit 用的是整机规格。
  // 前端必须把这件事显示出来:否则开发机上看到的 0.3% 会被当成生产表现。
  bool limits_from_cgroup = 13;

  google.protobuf.Timestamp sampled_at = 14;
  google.protobuf.Duration uptime = 15;

  // 本次采样中失败的子项。空表示全部正常。
  // 有值时前端把对应的卡片标灰,而不是显示 0 —— 0 和「没采到」不是一回事。
  repeated string degraded = 16;
}

message DependencyStatus {
  string name = 1;   // postgres / redis
  bool healthy = 2;
  string detail = 3; // 不健康时的原因;健康时为空
}

message BuildInfo {
  string service_name = 1;
  // API 契约版本(形如 v1),来自 SERVICE_VERSION。会进 Consul 服务标签与 OTel
  // service.version;它回答「这个进程讲哪一版协议」,不回答「它由哪次构建产生」。
  string version = 2;
  string environment = 3;
  string go_version = 4;
  // 构建制品版本:镜像 tag 或 commit,由 ldflags 注入 go-connect-kit/meta.Version。
  // 与 version 是两个概念,不要合并——合并后就无法区分「v1 契约」和「哪次构建」。
  // 本地构建没有注入时为 "dev"。响应字段不校验:它只是回显,没有输入可拒绝。
  string build_version = 5;
}

message QueryMetricsRequest {
  // 要哪几组曲线。上限 8 组是因为每组会展开成 1~N 条 PromQL,
  // 一次请求打出去的查询数要有个头。
  repeated MetricSeries series = 1 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 8,
    (buf.validate.field).repeated.unique = true,
    (buf.validate.field).repeated.items = {
      enum: {defined_only: true, not_in: [0]}
    }
  ];

  // 往前看多久。上限 24h:再长就该去 Grafana,那里有下采样和更合适的交互。
  google.protobuf.Duration window = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).duration.gte = {seconds: 300},
    (buf.validate.field).duration.lte = {seconds: 86400}
  ];

  // 采样步长。下限 10s 与 collector 的采集周期一致 —— 比它更细只会得到
  // 一堆插值出来的假点。
  int32 step_seconds = 3 [
    (buf.validate.field).int32.gte = 10,
    (buf.validate.field).int32.lte = 3600
  ];
}

message MetricPoint {
  int64 ts_ms = 1;
  double value = 2;
}

message MetricLine {
  // 图例名。P95 / node2 / GetKey 这类,由服务端从查询结果的标签里取,
  // 前端直接展示,不做二次解释。
  string label = 1;
  MetricUnit unit = 2;
  repeated MetricPoint points = 3;
}

message SeriesResult {
  MetricSeries series = 1;
  repeated MetricLine lines = 2;
  // 该组查询失败的原因。单组失败不影响其他组返回 —— 一个指标暂时没数据
  // 不该让整页空白。
  string error = 3;
}

message QueryMetricsResponse {
  repeated SeriesResult results = 1;
  bool metrics_backend_available = 2;
}
