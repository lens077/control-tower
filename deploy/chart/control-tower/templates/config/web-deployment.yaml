{{- if and .Values.config.enabled .Values.configWeb.enabled }}
# Web 控制台:Caddy 伺服构建产物,与后端分开发版
# (前端改一行不必重建 Go 二进制,这也是没选 embed.FS 的原因)。
{{- if .Values.configWeb.rollouts.enabled }}
# Argo Rollouts Blue-Green（configWeb.rollouts.enabled）：active Service 名字不变，
# 新版本先起在 preview Service 后面，kubectl argo rollouts promote 后才切流量。
apiVersion: argoproj.io/v1alpha1
kind: Rollout
{{- else }}
apiVersion: apps/v1
kind: Deployment
{{- end }}
metadata:
  name: config-center-web
  namespace: {{ .Values.config.namespace }}
  labels:
    app: config-center-web
spec:
  replicas: {{ .Values.configWeb.replicas }}
{{- if .Values.configWeb.rollouts.enabled }}
  revisionHistoryLimit: 3
  strategy:
    blueGreen:
      activeService: config-center-web
      previewService: config-center-web-preview
      autoPromotionEnabled: {{ .Values.configWeb.rollouts.autoPromotionEnabled }}
      # 给 Service endpoint 更新留出传播时间再缩掉旧版本
      scaleDownDelaySeconds: {{ .Values.configWeb.rollouts.scaleDownDelaySeconds }}
{{- end }}
  selector:
    matchLabels:
      app: config-center-web
  template:
    metadata:
      name: config-center-web
      labels:
        app: config-center-web
    spec:
      imagePullSecrets:
        - name: {{ .Values.imagePullSecret }}
      containers:
        - name: config-center-web
          image: {{ include "ct.image" (dict "name" "config-web" "registry" .Values.registry "image" .Values.configWeb.image) }}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          # Caddy 里为 /healthz 单独开了一条 respond,不会落进 SPA fallback
          # (落进去的话返回的是 index.html + 200,探针永远认为健康)。
          # 静态伺服没有下游依赖,所以就绪与存活可以共用一个端点 ——
          # 这与后端不同,后端的 /healthz 探 DB/缓存,不能拿来做存活。
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: {{ .Values.configWeb.resources.requests.cpu }}
              memory: {{ .Values.configWeb.resources.requests.memory }}
            limits:
              cpu: {{ .Values.configWeb.resources.limits.cpu }}
              memory: {{ .Values.configWeb.resources.limits.memory }}
          volumeMounts:
            # 覆盖镜像里那份构建期的 config.json,实现运行时注入 ——
            # 换网关地址/Casdoor 只改 ConfigMap 重启 Pod,不必重建镜像。
            # subPath 是必须的:不加会把整个 /usr/share/caddy 目录换成 ConfigMap,
            # 前端所有静态资源当场消失(这个错的表现是白屏且 404,很难一眼看出)。
            - name: runtime-config
              mountPath: /usr/share/caddy/config.json
              subPath: config.json
              readOnly: true
      restartPolicy: Always
      volumes:
        - name: runtime-config
          configMap:
            name: config-center-web-config
{{- end }}
