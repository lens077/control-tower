{{- if and .Values.config.enabled (or .Values.config.vpa.enabled (and .Values.configWeb.enabled .Values.configWeb.vpa.enabled (not .Values.configWeb.rollouts.enabled))) }}
# 目标模式是 InPlace:原地调整资源不重启 Pod —— 对 config-center 尤其重要,
# WatchKeys 是长连接流,重启会把所有订阅者踢掉,它们要退避重连再重收一遍快照。
# 但 InPlace 需要 VPA admission-controller 打开 InPlace feature gate
# (见 cloud-native-deploy/vpa/install.sh 里对 admission-controller 与 updater 的 patch);
# 2026-09-27 核对重建后的集群没开,webhook 直接拒绝(这两份 VPA 此前从未 apply 成功过)。
# 所以 values 里先用 Off:只出推荐值、不动 Pod,与集群里其它 VPA 一致。
# 绝不要用 Recreate/Auto 顶替:那会为了调资源驱逐 Pod,正是这里要避免的。
# 开了 gate 之后把 config.vpa.updateMode / configWeb.vpa.updateMode 改回 "InPlace"。
{{- if .Values.config.vpa.enabled }}
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: config-center-vpa
  namespace: {{ .Values.config.namespace }}
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    # 必须与 deployment.yaml 的 metadata.name 逐字一致 —— 写错 VPA 会静默不生效,
    # 不报错也不告警(ecommerce 仓根那份 application-vpa.yml 就踩了这个:
    # 它写的是裸服务名而实际 Deployment 叫 ecommerce-xxx-deploy)
    name: config-center
  updatePolicy:
    updateMode: {{ .Values.config.vpa.updateMode | quote }}
  resourcePolicy:
    containerPolicies:
      - containerName: '*'
        minAllowed:
          cpu: {{ .Values.config.vpa.minAllowed.cpu | quote }}
          memory: {{ .Values.config.vpa.minAllowed.memory | quote }}
        maxAllowed:
          # 上限对齐 deployment 里的 limits,VPA 不该把它推到超出集群预算
          cpu: {{ .Values.config.vpa.maxAllowed.cpu | quote }}
          memory: {{ .Values.config.vpa.maxAllowed.memory | quote }}
{{- end }}
{{- if and .Values.configWeb.enabled .Values.configWeb.vpa.enabled (not .Values.configWeb.rollouts.enabled) }}
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: config-center-web-vpa
  namespace: {{ .Values.config.namespace }}
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: config-center-web
  updatePolicy:
    updateMode: {{ .Values.configWeb.vpa.updateMode | quote }}
  resourcePolicy:
    containerPolicies:
      - containerName: '*'
        # 静态文件伺服,要不了多少 —— 给得比后端低一档
        minAllowed:
          cpu: {{ .Values.configWeb.vpa.minAllowed.cpu | quote }}
          memory: {{ .Values.configWeb.vpa.minAllowed.memory | quote }}
        maxAllowed:
          cpu: {{ .Values.configWeb.vpa.maxAllowed.cpu | quote }}
          memory: {{ .Values.configWeb.vpa.maxAllowed.memory | quote }}
{{- end }}
{{- end }}
