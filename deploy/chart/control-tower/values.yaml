# control-tower chart 公共默认值。
#
# 这里放的是与环境无关的结构：副本、探针、资源、Casdoor 信任域。
# 环境相关值（DEPLOYMENT_MODE、主机名、镜像 tag、BFF 回调）在 values-<env>.yaml，
# 两份 values 一律叠加使用：-f values.yaml -f values-<env>.yaml。
#
# 三个组件各有 enabled 开关，用于 Argo CD 按 namespace 拆成两个 Application
# （见 components/*.yaml）；本地渲染 deploy/<env>/ 时三者都开。
#
# Secret 一律不在 chart 里：这里只引用名字（tcr-pull、config-center-bootstrap、
# config-center-iam、dragonfly-session、casdoor-bff、control-tower-config-source-<env>、
# consul-ecommerce-token、otel-auth），由人按 deploy/README.md 建好。

# DEPLOYMENT_MODE；同时决定注释与守门测试里的环境语义。
environment: pre

imagePullSecret: tcr-pull

registry: ccr.ccs.tencentyun.com/sumery

casdoor:
  issuer: https://casdoor.apikv.com
  # 共享 client id（非机密）：config 服务校验 audience，config-web 发起登录，网关作 JWT audiences。
  clientId: baxf6718e392099b7915
  # 网关 JWT audiences 的追加白名单（非机密，CSV 追加在 clientId 之后）：
  # 各前端应用的 client id，如 PalCommerce 商城（casdoor 应用 Pal，证书 CN=Pal）。
  extraAudiences: []
  organizationName: lens
  appName: ecommerce

config:
  enabled: true
  # 独占 namespace：config-center 是基础设施而不是电商业务（同 loki / observability）。
  namespace: config-center
  # 渲染 Namespace 对象。Argo CD 的 AppProject 不放行集群级资源，那边关掉（components/config.yaml）。
  createNamespace: true
  image:
    repository: control-tower-config
    tag: ""
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }
  # HTTPRoute 主机名：Web 与 API 各一组（按 host 分而不是按路径分，见模板注释）。
  hosts:
    web: []
    api: []
  # cert-manager 证书：当前不是入口必需（共享 cilium-gateway 已有泛域名证书），
  # 留给 server.tls / TLSRoute Passthrough 场景。
  certificate:
    commonName: config.app.com
    dnsNames: []
  vpa:
    enabled: true
    # Off：只出推荐值。InPlace 需要 admission-controller 开 InPlace feature gate，
    # 当前集群没开（apply 会被 webhook 拒绝），开了之后再改（见模板注释）。
    updateMode: "Off"
    minAllowed: { cpu: 50m, memory: 128Mi }
    maxAllowed: { cpu: 500m, memory: 512Mi }

configWeb:
  enabled: true
  image:
    repository: control-tower-config-web
    tag: ""
  replicas: 1
  # 运行时注入到 config.json 的后端地址（浏览器跨源访问，必须在 config 服务的 CORS 白名单里）。
  apiUrl: ""
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }
  vpa:
    enabled: true
    updateMode: "Off"
    minAllowed: { cpu: 10m, memory: 32Mi }
    maxAllowed: { cpu: 200m, memory: 128Mi }
  # Argo Rollouts Blue-Green（与 ecommerce 前端同一套做法）。
  # 开启后 Deployment 变为 Rollout，多一个 preview Service，VPA 关闭（VPA 对 Rollout target 未验证）。
  # 默认关；先完成 Argo CD 接管，再在 pre 单独开启并做一次 promote 验收。
  rollouts:
    enabled: false
    autoPromotionEnabled: false
    scaleDownDelaySeconds: 30

gateway:
  enabled: true
  namespace: ecommerce
  image:
    repository: control-tower-gateway
    tag: ""
  # 双副本 + PDB；硬 spread 与 anti-affinity 下不用 surge。
  replicas: 2
  resources:
    requests: { cpu: 150m, memory: 256Mi }
    limits: { cpu: 300m, memory: 512Mi }
  hosts: []
  # PalCommerce 站点：只把 /shop.v1.shopService/ 转到本网关。为空表示不渲染
  # （dev 没有 palcommerce 命名空间，只有 pre 打开）。
  palcommerceHost: ""
  # selector（type=config_center，key=routes.yaml）+ machine token，按环境各一份 Secret。
  configSourceSecret: ""
  bff:
    # 网关自己的公网源；redirect_uri = publicBaseUrl + /auth/callback。
    publicBaseUrl: ""
    # 登录完允许跳回的前端源（绝对地址）。
    allowedRedirects: ""
    # 只有明文 HTTP 的本地开发才为 true；对外环境必须为 false（守门测试会拦）。
    cookieInsecure: false
  session:
    redisAddr: dragonfly.dragonfly.svc:6379
    secret: dragonfly-session
  # ── T1 可信身份边界（WP-2）：对 PalCommerce shop 上游签发内部断言 + mTLS。
  # 需求权威：palcommerce/docs/shop/trusted-identity-contract.md（冻结件）；
  # 共享契约：同目录 T1-implementation-plan.md §1.4/§1.7。契约 §三：mTLS、JWT 断言
  # 与 NetworkPolicy 三项同时强制，不提供单边降级——下面两个开关要同开同关。
  # 默认关：三个 Secret（断言私钥 / 客户端证书对 / shop CA）由 WP-3 在 ecommerce
  # ns 备齐后才允许翻 true，否则 secretKeyRef(optional=false) 会让 Pod 起不来。
  assertion:
    enabled: false
    # 断言生效的 proto 一级包名（routes 里 package: shop）。
    packages: [shop]
    issuer: palcommerce-gateway
    audience: shop
    ttl: 300s
    # kid 必须与 WP-3 发布的 JWKS 一致；翻 true 前确认。
    keyId: ""
    # 断言私钥 Secret（key 见 keySecretKey），与网关同 namespace，WP-3 创建。
    keySecret: control-tower-assertion-key
    keySecretKey: signing-key.pem
    keyFile: /etc/control-tower/assertion-key/signing-key.pem
    # 角色 → 动作映射（§1.4；「+」= 在前一角色集合上追加）。
    rolePermissions: "customer:catalog.read,wallet.read,order.read,order.create,topup.create,topup.read;admin:+topup.manual,+topup.refund,+order.read.admin,+wallet.read.admin,+audit.read,+order.refund,+order.cancel,+order.reconcile;anonymous:catalog.read"
  shopUpstreamTLS:
    enabled: false
    serverName: pal-shop-service.palcommerce.svc
    # 客户端证书对 Secret（tls.crt/tls.key）与 shop CA Secret（ca.crt）：
    # 原件在 palcommerce ns 由 WP-3 管理，跨 ns 引用 Secret 无效，
    # 所以 ecommerce ns 各有一份拷贝（由人同步），chart 只挂载。
    clientCertSecret: control-tower-gateway-mtls-client
    caSecret: pal-shop-mtls-ca
    mountDir: /etc/control-tower/shop-mtls
  consul:
    addr: consul-server.consul.svc.cluster.local:8500
    # 网关不经 Consul 找任何后端（routes 全是 direct://），token 只是 hashicorp client 的兜底。
    # 该 Secret 在新集群里不存在，引用必须 optional，否则 Pod 起不来。
    tokenSecret: consul-ecommerce-token
  otlp:
    endpoint: otel-opentelemetry-collector.opentelemetry.svc:4318
    tracesSamplerRatio: "0.2"
    headersSecret: otel-auth
  logLevel: info
  vpa:
    enabled: true
    # Off：只出推荐值不动 Pod。Recreate/Auto 会与 PDB 拉扯（见模板注释）。
    updateMode: "Off"
    minAllowed: { cpu: 100m, memory: 128Mi }
    maxAllowed: { cpu: 300m, memory: 512Mi }
