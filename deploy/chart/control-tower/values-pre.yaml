# pre：对外可达的环境（config.apikv.com / gateway.apikv.com）。Argo CD 只同步这一份。
# 镜像 tag 由 CI 在发布 tag（X.Y.Z）时回写，不要手改成 dev/latest。
environment: pre
config:
  image:
    tag: 0.3.0
  hosts:
    web: [config.dev.test, config.apikv.com]
    api: [config-api.dev.test, config-api.apikv.com]
  certificate:
    dnsNames: [config.dev.test, config-api.dev.test]
configWeb:
  image:
    tag: 0.3.0
  apiUrl: https://config-api.apikv.com
gateway:
  image:
    tag: 0.4.0
  hosts: [gateway.dev.test, gateway.apikv.com]
  palcommerceHost: pal.apikv.com
  configSourceSecret: control-tower-config-source-pre
  bff:
    publicBaseUrl: https://gateway.apikv.com
    allowedRedirects: "https://shop.apikv.com,https://pal.apikv.com"
    cookieInsecure: false
  # ── T1 可信身份边界（PalCommerce shop 上游）。2026-11-10 启用：kid 与
  # Config Center gateway/pre/assertion/jwks.json 逐字一致；三个 Secret
  # （control-tower-assertion-key / control-tower-gateway-mtls-client /
  # pal-shop-mtls-ca 拷贝）已由 WP-3 备齐。
  assertion:
    enabled: true
    keyId: palcommerce-gateway-20261110
  shopUpstreamTLS:
    enabled: true
# PalCommerce 商城登录：Casdoor 应用 Pal（org lens）签发的 token aud 为其 client id，
# 网关验签要求 aud 在白名单内，这里追加（clientId 见 values.yaml，非机密）。
casdoor:
  extraAudiences:
    - 50acc1273cdff0ff9f12
