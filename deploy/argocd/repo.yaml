# GitHub 源码仓在 Argo CD 里的声明。仓库是公开的，不带凭据；
# 若改为私有，在集群外建带 token 的 Secret，不要把 token 提交进来。
apiVersion: v1
kind: Secret
metadata:
  name: repo-github-control-tower
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
  annotations:
    app.kubernetes.io/part-of: control-tower
    app.kubernetes.io/managed-by: git
stringData:
  type: git
  name: github-control-tower
  project: control-tower
  url: https://github.com/lens077/control-tower.git
