# control-tower 网关（pre）。与旧网关并行部署在同一 namespace，
# 切流 = 把 ecommerce-gateway-service 的 selector 从 app: ecommerce-gateway
# 改为 app: control-tower-gateway；回滚 = 改回（手顺：docs/design/cutover.md）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-tower-gateway
  namespace: ecommerce
  labels:
    app: control-tower-gateway
    app.kubernetes.io/part-of: ecommerce
spec:
  # 双副本 + PDB 保证滚动期至少一个副本可用。硬 spread 与 anti-affinity 下不使用 surge，
  # 否则第三个临时 Pod 可能没有同时满足两条约束的节点。
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app: control-tower-gateway
  template:
    metadata:
      labels:
        app: control-tower-gateway
        app.kubernetes.io/part-of: ecommerce
    spec:
      # anti-affinity 保证双副本分节点；suite-wide spread 让网关与单副本业务共同计数。
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: control-tower-gateway
              topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeAffinityPolicy: Honor
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app.kubernetes.io/part-of: ecommerce
      serviceAccountName: control-tower-gateway
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      imagePullSecrets:
        - name: tcr-pull
      containers:
        - name: gateway
          # 禁 latest；使用发布 semver tag，发布后不得覆写同名 tag。
          image: ccr.ccs.tencentyun.com/sumery/control-tower-gateway:0.2.17
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SERVICE_NAME
              value: control-tower-gateway
            - name: DEPLOYMENT_MODE
              value: pre
            - name: HTTP_PORT
              value: ":8080"
            # 自举：selector（type=config_center，key=routes.yaml）经 Secret 挂载。
            - name: CONFIG_SOURCE_FILE
              value: /etc/control-tower/config-source/gateway.yaml
            # Consul 只做发现。ACL 开启后缺 token 的症状是 200 空列表而不是报错；
            # 变量名必须是 CONSUL_HTTP_TOKEN（hashicorp client 的兜底读取）。
            - name: CONSUL_HTTP_ADDR
              value: consul-server.consul.svc.cluster.local:8500
            - name: CONSUL_HTTP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: consul-ecommerce-token
                  key: CONSUL_HTTP_TOKEN
            # JWT 信任域绑定（docs/design/auth.md）。audiences=各前端 Casdoor client id（CSV，非机密）。
            - name: JWT_ISSUER
              value: https://casdoor.apikv.com
            - name: JWT_AUDIENCES
              valueFrom:
                configMapKeyRef:
                  name: control-tower-gateway-config
                  key: JWT_AUDIENCES
            # 高危路由在线校验凭据（可选；未配置时 online_check 路由 fail-close）。
            - name: CASDOOR_URL
              value: https://casdoor.apikv.com
            # ── BFF 会话轨（ADR-0002）。SESSION_REDIS_ADDR / CASDOOR_CLIENT_ID /
            # CASDOOR_CLIENT_SECRET / BFF_PUBLIC_BASE_URL 四项齐备才启用（main.go 的
            # 降级分支），缺任一项就静默退回纯 legacy bearer —— 表现是**站点根本没有登录入口**，
            # 不是报错。所以这一整块在 pre 不能省。
            #
            # 2026-09-20 事故：本文件此前完全没有 BFF 环境变量，而集群 ns=ecommerce 里
            # 长期跑的是 dev 那一份（DEPLOYMENT_MODE=dev 实测），于是线上 shop.apikv.com
            # 点登录被 Casdoor 送去 http://localhost:3000/auth/callback —— dev 的值上了公网。
            - name: SESSION_REDIS_ADDR
              value: dragonfly.dragonfly.svc:6379
            - name: SESSION_REDIS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: dragonfly-session
                  key: username
            - name: SESSION_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dragonfly-session
                  key: password
            # Dragonfly 以 --tls 启动，明文连不上；证书 SAN 含 dragonfly.dragonfly.svc，
            # 故正常验 CA，不用 InsecureSkipVerify。
            - name: SESSION_REDIS_TLS
              value: "true"
            - name: SESSION_REDIS_CA_FILE
              value: /etc/control-tower/session-tls/ca.crt
            # pre 全程 HTTPS：**不设** SESSION_COOKIE_INSECURE，会话 cookie 保持
            # DefaultCookieConfig 的 __Secure- 前缀 + Secure 属性。
            # 也**不设** SESSION_COOKIE_DOMAIN：cookie 按 host-only 落在 gateway.apikv.com，
            # 前端 shop.apikv.com 与它同站（同一 eTLD+1 apikv.com），SameSite=Lax 不拦；
            # 跨源取用靠 routes.yaml 的 cors.allow_credentials + allow_origins 放行。
            # 设成 .apikv.com 只会把 cookie 多发给一堆不需要它的子域。
            #
            # 回调基地址必须是**网关自己的公网源**：OAuth 回调打的是网关的 /auth/callback
            # （redirectURI() = BFF_PUBLIC_BASE_URL + "/auth/callback"），不是前端路由。
            # ⚠️ Casdoor 应用 ecommerce 的 Redirect URLs 必须含 https://gateway.apikv.com/auth/callback。
            - name: BFF_PUBLIC_BASE_URL
              value: https://gateway.apikv.com
            # 登录完跳回前端。网关 redirectAllowed() 无条件放行相对路径，而相对路径会按
            # **网关的源**解析（回调末尾直接 http.Redirect），所以前端必须传绝对地址
            # （frontend packages/configs/src/auth/bff.ts 的 startBffLogin 已归一化），
            # 这里逐条列出允许跳回的前端源。
            - name: BFF_ALLOWED_REDIRECTS
              value: https://shop.apikv.com
            # optional=true：Secret 缺失时 env 不注入，会话轨自动保持关闭而不是 CrashLoop。
            - name: CASDOOR_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: casdoor-bff
                  key: client-id
                  optional: true
            - name: CASDOOR_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: casdoor-bff
                  key: client-secret
                  optional: true
            # 可观测：推 OTLP；采样跟随父，根按比例。
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: control-tower-gateway-config
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
                  optional: true
            - name: OTEL_TRACES_SAMPLER_RATIO
              value: "0.2"
            # OTLP 鉴权头(Vault → ExternalSecret otel-auth，网关专属 key)。
            # optional=true：Secret 未就绪时退回匿名发送而不是 CrashLoop。
            - name: OTEL_EXPORTER_OTLP_HEADERS
              valueFrom:
                secretKeyRef:
                  name: otel-auth
                  key: OTEL_EXPORTER_OTLP_HEADERS_GATEWAY
                  optional: true
            - name: LOG_LEVEL
              value: info
          volumeMounts:
            - name: config-source
              mountPath: /etc/control-tower/config-source
              readOnly: true
            - name: session-tls
              mountPath: /etc/control-tower/session-tls
              readOnly: true
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            # 就绪 = 路由表 + JWT 公钥 + Casbin 全部加载 + resolver 有快照。
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 300m
              memory: 512Mi
      volumes:
        # 会话存储的 CA。Secret dragonfly-session 同时带 username/password/ca.crt，
        # 这里只挂 ca.crt。
        - name: session-tls
          secret:
            secretName: dragonfly-session
            items:
              - key: ca.crt
                path: ca.crt
            defaultMode: 0444
        - name: config-source
          secret:
            secretName: control-tower-config-source-pre
            defaultMode: 0400
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: control-tower-gateway
  namespace: ecommerce
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: control-tower-gateway
---
# 非机密运行参数（audiences、OTLP 端点按环境填写）。
apiVersion: v1
kind: ConfigMap
metadata:
  name: control-tower-gateway-config
  namespace: ecommerce
data:
  # 逗号分隔的 Casdoor client id 白名单：consumer/merchant/admin/desktop。
  # 占位值，P5 切流前以实际 client id 填充（非机密）。
  JWT_AUDIENCES: "baxf6718e392099b7915"
  # 2026-08-24 修正：原值是 jaeger.observability.svc:4318 —— 网关把**指标**也发到了
  # Jaeger 的 OTLP 端口，而 Jaeger 只收 trace，日志里一直在刷
  #   failed to send metrics to http://jaeger.observability.svc:4318/v1/metrics: 404
  # OTLP 三种信号要发给 collector 统一分流，不能直连某个后端。
  OTEL_EXPORTER_OTLP_ENDPOINT: "otel-opentelemetry-collector.opentelemetry.svc:4318"
