# 由 deploy/chart/control-tower 渲染生成（make deploy-render），不要手改：
# 改模板或 values-pre.yaml 后重新渲染；CI 的 check-deploy 会比对。
# Shared API gateway entrypoints. Public traffic reaches this listener through
# Pangolin/newt; LAN clients may use the dev.test hostname directly.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: control-tower-gateway
  namespace: ecommerce
spec:
  parentRefs:
    - name: cilium-gateway
      namespace: default
      sectionName: https
  hostnames:
    - "gateway.dev.test"
    - "gateway.apikv.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: ecommerce-gateway-service
          port: 8080
---
# PalCommerce 站点上的商城主机只借道本网关的 RPC 前缀，
# 其余路径（/、/alipay/*）仍由 palcommerce 自己的 HTTPRoute 负责：
# 这里只声明商城与 QQ 绑定两个 RPC 前缀，更具体的路径优先，不会与 landing 的 / 冲突。
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: control-tower-gateway-pal
  namespace: ecommerce
spec:
  parentRefs:
    - name: cilium-gateway
      namespace: default
      sectionName: https
  hostnames:
    - "pal.apikv.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /shop.v1.shopService/
        # QQ 机器人绑定（qqbot.v1.qqbotService），同样经网关注入身份后 direct 到 pal-qqbot。
        - path:
            type: PathPrefix
            value: /qqbot.v1.qqbotService/
      backendRefs:
        - name: ecommerce-gateway-service
          port: 8080
