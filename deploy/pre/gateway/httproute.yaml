# Shared API gateway entrypoints. Public traffic reaches this listener through
# Pangolin/newt; LAN clients may use the dev.test hostname directly.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: control-tower-gateway
  namespace: ecommerce
spec:
  parentRefs:
    - name: cilium-gateway
      namespace: default
      sectionName: https
  hostnames:
    - "gateway.dev.test"
    - "gateway.apikv.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: ecommerce-gateway-service
          port: 8080
