# 网关后端 Service（pre）。对外入口统一由共享 cilium-gateway 的 HTTPRoute 提供；
# 本 Service 只在集群内承接转发。若将来旧网关回归并行，切流语义见 cutover.md §3。
apiVersion: v1
kind: Service
metadata:
  name: ecommerce-gateway-service
  namespace: ecommerce
  labels:
    app: control-tower-gateway
spec:
  type: ClusterIP
  selector:
    app: control-tower-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
