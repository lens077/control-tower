# 由 deploy/chart/control-tower 渲染生成（make deploy-render），不要手改：
# 改模板或 values-dev.yaml 后重新渲染；CI 的 check-deploy 会比对。
# Shared API gateway entrypoints. Public traffic reaches this listener through
# Pangolin/newt; LAN clients may use the dev.test hostname directly.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: control-tower-gateway
  namespace: ecommerce
spec:
  parentRefs:
    - name: cilium-gateway
      namespace: default
      sectionName: https
  hostnames:
    - "gateway.dev.test"
    - "gateway.apikv.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: ecommerce-gateway-service
          port: 8080
