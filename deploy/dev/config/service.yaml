# 由 deploy/chart/control-tower 渲染生成（make deploy-render），不要手改：
# 改模板或 values-dev.yaml 后重新渲染；CI 的 check-deploy 会比对。
apiVersion: v1
kind: Service
metadata:
  name: config-center
  namespace: config-center
spec:
  selector:
    app: config-center
  ports:
    # 端口必须命名:HTTPRoute 的 backendRefs 与 Gateway 都按名字找
    - name: http
      protocol: TCP
      port: 30010
      targetPort: http
  type: ClusterIP
