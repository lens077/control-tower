apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-center
  namespace: config-center
  labels:
    app: config-center
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-center
  template:
    metadata:
      name: config-center
      labels:
        app: config-center
    spec:
      containers:
        - name: config-center
          image: ghcr.io/lens077/control-tower-config:0.2.10
          imagePullPolicy: Always
          env:
            # 关闭应用内的 Log 导出器，只保留 Trace 和 Metric。
            # 日志输出到 stdout，由部署在 k8s 的 Fluent Bit 统一采集
            - name: OTEL_LOGS_EXPORTER
              value: "none"
            # 紧急旁路改为 observe；正常环境必须保持 enforce。
            - name: CONFIG_SCHEMA_MODE
              value: "enforce"
            # SERVICE_NAME 只标识本服务的遥测与可选 Consul 注册名。
            # 网关读取配置固定走 K8s Service DNS
            # (http://config-center.config-center.svc:30010,见 Secret
            # ecommerce/control-tower-config-source-{dev,pre});
            # routes/{dev,pre}.yaml 的 discovery:/// 只指向 11 个业务后端。
            - name: SERVICE_NAME
              value: "config-service"
            - name: SERVICE_VERSION
              value: "v1"
            - name: DEPLOYMENT_MODE
              value: "dev"
            # The service itself always boots from this mounted local file.
            - name: CONFIG_FILE
              value: "/etc/config-center/config.yaml"
            - name: CASDOOR_CERTIFICATE_FILE
              value: "/etc/config-center/casdoor.pem"
            - name: CASDOOR_ISSUER
              value: "https://casdoor.apikv.com"
            - name: CASDOOR_AUDIENCE
              value: "a36e6718e392099b7915"
            - name: CONFIG_CENTER_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: config-center-iam
                  key: service-token
            # Consul is discovery only, never this service's configuration source.
            #
            # 2026-08-29 关掉,理由同 pre：本服务注册进 Consul 没有消费方,
            # 网关走 K8s Service DNS 找它,routes 里的 discovery:/// 只指业务后端。
            # 同时删掉了 CONSUL_HTTP_TOKEN —— 它引用的 Secret consul-config-center-token
            # 随旧 config-center ns 一起没了,**留着会让 Pod 起不来**:
            # 环境变量解析先于容器启动,secretKeyRef 找不到就是 CreateContainerConfigError,
            # 与 CONSUL_ENABLED 是不是 false 无关。
            # 重新开启的步骤见 deploy/pre/config/deployment.yaml 同一段注释。
            - name: CONSUL_ENABLED
              value: "false"
            - name: CONSUL_ADDR
              value: "consul-server.consul.svc:8500"
            - name: CONSUL_SCHEME
              value: "http"
            - name: CONSUL_INSECURE_SKIP_VERIFY
              value: "false"
          ports:
            # 命名端口:Service 与 HTTPRoute 用名字引用,改端口号时不必三处同步
            - name: http
              containerPort: 30010
              protocol: TCP
          # /healthz 在 DB/缓存不通时返回 503。就绪探针据此摘流量;
          # 存活探针只探端口 —— 用 /healthz 做存活会让一次数据库抖动把所有 Pod 连环重启。
          readinessProbe:
            httpGet:
              path: /healthz
              port: 30010
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 30010
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: bootstrap
              mountPath: /etc/config-center
              readOnly: true
      restartPolicy: Always
      volumes:
        - name: bootstrap
          secret:
            secretName: config-center-bootstrap
